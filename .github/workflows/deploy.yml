name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - claude/spanish-vocab-matcher-860m7x
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom (used by tests/main.test.mjs) requires Node
          # ^22.22.2 || ^24.15.0 || >=26.0.0 -- Node 20 fails at import
          # time (undici's webidl.util.markAsUncloneable is missing).
          node-version: 22.22.2
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      # Only main is ever deployed (see the "deploy" job below) -- these
      # Pages-specific steps are skipped on other branches so they stay
      # build+test-only CI, instead of producing an artifact nothing will
      # use and a "deploy" job that's guaranteed to fail environment
      # protection.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
